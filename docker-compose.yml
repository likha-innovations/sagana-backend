services:
  postgres:
    image: postgres:16-alpine
    container_name: sagana_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sagana_dev
    ports:
      - "5432:5432"
    volumes:
      - sagana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sagana_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sagana_pgdata:
